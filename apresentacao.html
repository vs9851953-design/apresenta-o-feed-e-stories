<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>VTD DESIGN | Apresentação</title>
  <meta name="description" content="Conheça os trabalhos da VTD DESIGN, estúdio de design gráfico.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/apresentacao.css">
</head>
<body>

<main class="app" id="app">

  <!-- TELA 1 — ABERTURA -->
  <section class="secao secao-intro" id="s-intro" aria-label="Abertura">
    <button class="intro-botao" id="btn-iniciar" type="button">
      <img class="logo" id="intro-logo" alt="Logotipo VTD DESIGN">
      <span class="intro-texto" id="intro-texto">TOQUE NA TELA</span>
    </button>
  </section>

  <!-- TELA 2 — POST FEED -->
  <section class="secao secao-feed" id="s-feed" aria-label="Post feed">
    <div class="texto-bloco" id="feed-texto">
      <h2 class="titulo" id="feed-titulo"></h2>
      <span class="barra-titulo" aria-hidden="true"></span>
      <p class="descricao" id="feed-descricao"></p>
    </div>
    <div class="galeria" id="feed-galeria">
      <div class="trilho" id="feed-trilho"></div>
    </div>
    <div class="dica" id="feed-dica" aria-hidden="true">
      <span class="so-toque">DOIS TOQUES PARA CONTINUAR</span>
      <span class="so-clique">DOIS CLIQUES PARA CONTINUAR</span>
    </div>
  </section>

  <!-- TELA 3 — STORIES -->
  <section class="secao secao-stories" id="s-stories" aria-label="Stories">
    <div class="faixa" aria-hidden="true"></div>
    <div class="galeria" id="story-galeria">
      <div class="trilho" id="story-trilho"></div>
    </div>
    <div class="texto-bloco texto-dir" id="stories-texto">
      <h2 class="titulo" id="stories-titulo"></h2>
      <span class="barra-titulo" aria-hidden="true"></span>
      <p class="descricao" id="stories-descricao"></p>
    </div>
    <div class="dica" id="story-dica" aria-hidden="true">
      <span class="so-toque">DÊ DOIS TOQUES PARA CONTINUAR</span>
      <span class="so-clique">DÊ DOIS CLIQUES PARA CONTINUAR</span>
    </div>
  </section>

  <!-- TELA 4 — ORÇAMENTO -->
  <section class="secao secao-final" id="s-final" aria-label="Orçamento">
    <div class="final">
      <img class="logo" id="final-logo" alt="Logotipo VTD DESIGN">
      <a class="btn-cta" id="final-botao" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </section>

</main>

<div class="aviso" id="aviso" hidden role="status"></div>

<script src="js/apresentacao.js" defer></script>
</body>
</html>
