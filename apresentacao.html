<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>VTD DESIGN | Apresentação</title>
  <meta name="description" content="Conheça os trabalhos da VTD DESIGN, estúdio de design gráfico.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/apresentacao.css">
</head>
<body>

<main class="app" id="app">

  <!-- 1. ABERTURA -->
  <section class="tela ativa" id="tela-intro" aria-label="Abertura">
    <button class="intro-botao" id="btn-iniciar" type="button">
      <img class="logo" id="intro-logo" alt="Logotipo VTD DESIGN">
      <span class="intro-texto" id="intro-texto">TOQUE NA TELA</span>
    </button>
  </section>

  <!-- 2. PERFIL E FEED -->
  <section class="tela" id="tela-perfil" aria-label="Perfil do estúdio">
    <div class="perfil">
      <header class="perfil-topo">
        <div class="perfil-linha">
          <div class="avatar-anel">
            <img class="avatar" id="perfil-avatar" alt="Foto de perfil VTD DESIGN">
          </div>
          <div class="perfil-numeros">
            <div><strong id="stat-publicacoes">0</strong><span>publicações</span></div>
          </div>
        </div>
        <h1 class="perfil-nome" id="perfil-nome">VTD DESIGN</h1>
        <p class="perfil-usuario" id="perfil-usuario"></p>
        <p class="perfil-bio" id="perfil-bio"></p>
        <button class="btn-secundario" id="perfil-cta" type="button">FAÇA SEU ORÇAMENTO</button>
      </header>

      <div class="stories-barra" id="stories-barra" aria-label="Stories"></div>

      <nav class="abas" aria-hidden="true">
        <span class="aba ativa">▦ PUBLICAÇÕES</span>
      </nav>

      <div class="grade" id="grade"></div>

      <div class="perfil-rodape">
        <button class="link-discreto" id="ir-final" type="button">Entrar em contato →</button>
      </div>
    </div>
  </section>

  <!-- 5. TELA FINAL -->
  <section class="tela" id="tela-final" aria-label="Contato">
    <div class="final">
      <img class="logo" id="final-logo" alt="Logotipo VTD DESIGN">
      <h2 class="final-texto" id="final-texto"></h2>
      <a class="btn-cta" id="final-botao" target="_blank" rel="noopener noreferrer"></a>
      <button class="link-discreto" id="final-voltar" type="button">← Voltar ao perfil</button>
    </div>
  </section>

  <!-- VISUALIZAÇÃO DE POST -->
  <div class="overlay" id="viewer-post" hidden role="dialog" aria-modal="true" aria-label="Publicação">
    <div class="viewer-topo">
      <span class="contador" id="post-contador"></span>
      <button class="btn-fechar" id="post-fechar" type="button" aria-label="Fechar">✕</button>
    </div>
    <button class="seta seta-esq" id="post-anterior" type="button" aria-label="Publicação anterior">‹</button>
    <div class="post-palco" id="post-palco">
      <div class="post-quadro" id="post-quadro">
        <img id="post-imagem" alt="">
      </div>
    </div>
    <button class="seta seta-dir" id="post-proximo" type="button" aria-label="Próxima publicação">›</button>
    <div class="pontos" id="post-pontos"></div>
  </div>

  <!-- VISUALIZAÇÃO DE STORIES -->
  <div class="overlay overlay-story" id="viewer-story" hidden role="dialog" aria-modal="true" aria-label="Stories">
    <div class="story-barras" id="story-barras"></div>
    <div class="story-cabecalho">
      <img class="avatar-pequeno" id="story-avatar" alt="">
      <span class="story-nome" id="story-nome">VTD DESIGN</span>
      <button class="btn-fechar" id="story-fechar" type="button" aria-label="Fechar stories">✕</button>
    </div>
    <div class="story-palco" id="story-palco">
      <img id="story-imagem" alt="">
      <div class="story-zona zona-esq" aria-hidden="true"></div>
      <div class="story-zona zona-dir" aria-hidden="true"></div>
    </div>
  </div>

</main>

<div class="aviso" id="aviso" hidden role="status"></div>

<script src="js/apresentacao.js" defer></script>
</body> 
</html>
